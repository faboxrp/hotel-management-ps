name: prestashop-docker-compose

services:
  mysql:
    container_name: mysql-prestashop
    image: mysql:5.7
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: admin
      MYSQL_DATABASE: prestashop
    networks:
      - prestashop_network
    volumes:
      - dbdata:/var/lib/mysql

  prestashop:
    container_name: prestashop
    image: prestashop/prestashop:1.6.1.23
    restart: unless-stopped
    depends_on:
      - mysql
    ports:
      - 8080:80
    environment:
      DB_SERVER: mysql-prestashop
      DB_NAME: prestashop
      DB_USER: root
      DB_PASSWD: admin
      # PS_FOLDER_ADMIN: zidkoadmin
      # PS_FOLDER_INSTALL: zidkoinstall
    networks:
      - prestashop_network
      # - easypanel
    volumes:
      - psdata:/var/www/html
      #   - type: bind
      #     source: ./modules # local path to the module
      #     target: /var/www/html/modules # path to be mounted in the container
      #   - type: bind
      #     source: ./themes # local path to the theme
      #     target: /var/www/html/themes # path to be mounted in the container

      ## se pone labels en el contenedor/contenedores requeridos a exponer mediante traefik
      # labels:
      #   ## configuracion general, agregar network donde se instaló traefik (network=easypanel)
